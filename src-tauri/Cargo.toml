[package]
name = "flapcrypt"
version = "0.0.13"
description = "Flapcrypt - The Mechanical Split-Flap Cryptogram"
authors = ["Olai Digital Studios"]
edition = "2021"

[lib]
name = "flapcrypt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
