<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>FlapCrypt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-shell">
    <!-- 1. Fixed Ergonomic Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <h1>FlapCrypt</h1>
          <div class="level-nav-group">
            <button id="prevLevelBtn" class="btn-level-nav" title="Previous Level" aria-label="Previous Level">◀</button>
            <span class="level-badge" id="levelBadge">LVL 1/100 • DIFF 1.0</span>
            <button id="nextLevelBtn" class="btn-level-nav" title="Next Level" aria-label="Next Level">▶</button>
          </div>
          <span class="letter-badge" id="letterBadge">🔤 0 / 17</span>
        </div>
        <div class="header-actions">
          <button id="soundBtn" class="btn-sound" title="Toggle Sound" aria-label="Toggle Sound">🔊</button>
        </div>
      </div>
    </header>

    <!-- 2. Scrollable Play Stage -->
    <main class="play-stage" id="playStage">
      <div id="board" role="group" aria-label="Cryptogram Board">
        <div class="quote-area" id="quoteArea"></div>
        <div class="author-row" id="authorRow"></div>
      </div>
    </main>

    <!-- 3. Fixed Ergonomic Action Dock (Natural Thumb Zone) -->
    <footer class="action-dock" id="actionDock">
      <div id="status-bar" aria-live="polite"></div>

      <div id="controls" class="dock-controls">
        <!-- Secondary Utility Row: Unsolved Navigation & Hint -->
        <div class="dock-row secondary-row">
          <button id="prevBtn" class="btn-dock btn-nav" title="Previous Unsolved Letter">◀ PREV</button>
          <button id="hint" class="btn-dock btn-hint" title="Reveal Letter">💡 HINT (3)</button>
          <button id="nextBtn" class="btn-dock btn-nav btn-next" title="Next Unsolved Letter">NEXT ▶</button>
        </div>

        <!-- Primary Stepper Row (Forward & Reverse Flap Rotation) -->
        <div class="dock-row primary-steppers">
          <button id="tu" class="btn-dock btn-stepper-btn" title="Step Forward in Alphabet (A to Z)" aria-label="Step Forward in Alphabet">
            <span class="step-arrow">▲</span>
          </button>
          <button id="td" class="btn-dock btn-stepper-btn" title="Step Reverse in Alphabet (Z to A)" aria-label="Step Reverse in Alphabet">
            <span class="step-arrow">▼</span>
          </button>
        </div>
      </div>
    </footer>

    <!-- 4. Reserved Bottom Ad Banner Slot -->
    <div id="adBannerSlot" class="ad-banner-slot" aria-label="Ad Banner Space"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
